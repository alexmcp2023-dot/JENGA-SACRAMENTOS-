/* Animaciones funcionales de JENGA */
.block{transition:transform .35s ease,opacity .35s ease,filter .35s ease}
.block.lift{
  position:relative; z-index:50;
  animation:jengaLift 1.15s cubic-bezier(.2,.8,.25,1) forwards;
}
.block.fall{
  position:relative; z-index:50;
  animation:jengaFall 1.05s cubic-bezier(.4,0,.8,.2) forwards;
  transform-origin:center center;
}
@keyframes jengaLift{
  0%{transform:translate(0,0) rotate(0);filter:brightness(1)}
  35%{transform:translate(-35px,-35px) rotate(-4deg);filter:brightness(1.18)}
  70%{transform:translate(20px,-230px) rotate(4deg)}
  100%{transform:translate(0,-330px) rotate(0);opacity:.15}
}
@keyframes jengaFall{
  0%{transform:translate(0,0) rotate(0);opacity:1}
  25%{transform:translate(20px,20px) rotate(12deg)}
  60%{transform:translate(65px,150px) rotate(55deg)}
  100%{transform:translate(110px,430px) rotate(105deg);opacity:0}
}

const KEY='jenga-unificado-v2';
let state={name:'',xp:0,stability:80,done:[]};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.done))state=s}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function open(html){modal.innerHTML=html;dlg.showModal()}
function tower(interactive=false){let rows='';for(let r=0;r<12;r++){let row='';for(let j=0;j<3;j++){let id=r*3+j,done=state.done.includes(id);row+=`<button class="block ${done?'done':''}" ${interactive&&!done?'data-id="'+id+'"':'disabled'}>${id+1}</button>`}rows+=`<div class="row">${row}</div>`}return `<div class="stage"><div class="tower">${rows}</div><div class="caption">36 BLOQUES · UNA VIDA DE FE POR CONSTRUIR</div></div>`}
function home(){ $('app').innerHTML=`<section class="hero"><div><span class="badge">5.º de secundaria</span><h1>JENGA:<br>una vida de <em style="color:var(--mint)">fe.</em></h1><p>Supera retos sobre los siete sacramentos, el amor, las decisiones y el proyecto de vida. Cada respuesta correcta sostiene tu torre.</p><div class="actions"><button class="primary" id="startBtn">${state.name?'Continuar partida':'Iniciar juego'} ↗</button><button id="newBtn">Nueva partida</button></div><p class="muted">Este archivo funciona por sí solo: no necesita carpetas adicionales.</p></div>${tower(false)}</section>`;$('startBtn').onclick=()=>state.name?game():setup();$('newBtn').onclick=setup;}
function setup(){open(`<h2>Comenzar</h2><label>Nombre o alias</label><input id="name" maxlength="40" placeholder="Escribe un alias"><button class="primary" style="width:100%;margin-top:15px" id="begin">Comenzar</button>`);$('begin').onclick=()=>{state={name:$('name').value.trim()||'Estudiante',xp:0,stability:80,done:[]};save();dlg.close();game()}}
function game(){ $('app').innerHTML=`<div class="grid"><aside><div class="card"><div class="muted">${state.name}</div><div class="big">${state.xp} XP</div><p>Estabilidad: <strong>${state.stability}%</strong></p><progress value="${state.stability}" max="100"></progress></div><div class="card"><strong>Avance</strong><p>${state.done.length} de 36 bloques</p><progress value="${state.done.length}" max="36"></progress>${state.done.length>=24?'<button class="primary" id="finalBtn" style="width:100%;margin-top:12px">Reto final</button>':''}</div></aside>${tower(true)}</div>`;document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>challenge(Number(b.dataset.id)));if($('finalBtn'))$('finalBtn').onclick=finalChallenge;}

function animateBlock(id,type,callback){
  dlg.close();
  game();
  const el=document.querySelector('[data-id="'+id+'"]');
  if(!el){ if(callback) callback(); return; }
  el.disabled=true;
  el.classList.add(type==='lift'?'lift':'fall');
  setTimeout(()=>{ if(callback) callback(); }, type==='lift'?1200:1100);
}
function challenge(id){const b=blocks[id];const opts=b.options.map((t,i)=>({t,i})).sort(()=>Math.random()-.5);open(`<span class="badge">${b.title}</span><h2>Bloque ${id+1}</h2><p style="color:var(--text);font-size:19px">${b.question}</p>${opts.map((o,k)=>`<button class="choice" data-answer="${o.i}"><b>${String.fromCharCode(65+k)}.</b> ${o.t}</button>`).join('')}<p id="err" class="danger"></p>`);document.querySelectorAll('[data-answer]').forEach(x=>x.onclick=()=>answer(id,Number(x.dataset.answer)));}
function answer(id,a){
 const b=blocks[id];
 if(a===b.correct){
   state.xp+=10;
   state.stability=Math.min(100,state.stability+4);
   save();
   open(`<div class="card good"><h2>¡Correcto!</h2><p>${b.explanation}</p><span class="badge">+10 XP</span></div><button class="primary" style="width:100%" id="cont">Elevar bloque y colocarlo arriba</button>`);
   $('cont').onclick=()=>{
     animateBlock(id,'lift',()=>{
       if(!state.done.includes(id))state.done.push(id);
       save();
       game();
     });
   };
 }else{
   open(`<div class="card bad"><h2>¡Respuesta incorrecta!</h2><p>${b.explanation}</p><p>La respuesta adecuada era: <strong>${b.options[b.correct]}</strong>.</p><p><strong>El bloque caerá y la partida se reiniciará desde el comienzo.</strong></p></div><button class="primary" style="width:100%" id="restartAfterFail">Ver caer el bloque y reiniciar</button>`);
   $('restartAfterFail').onclick=()=>{
     animateBlock(id,'fall',()=>{
       const playerName=state.name || 'Estudiante';
       state={name:playerName,xp:0,stability:80,done:[]};
       save();
       game();
     });
   };
 }
}
function finalChallenge(){open(`<h2>Reto final</h2><p>Explica con tus palabras cómo los sacramentos pueden ayudarte a vivir la fe de manera concreta en tu familia, colegio y comunidad.</p><textarea id="reflection" style="width:100%;min-height:130px;background:#10212a;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:12px"></textarea><button class="primary" style="width:100%;margin-top:12px" id="finish">Finalizar</button><p id="msg" class="danger"></p>`);$('finish').onclick=()=>{const t=$('reflection').value.trim();if(t.length<30){$('msg').textContent='Escribe al menos 30 caracteres.';return}state.xp+=100;save();open(`<h2>¡Recorrido completado!</h2><div class="card"><div class="big">${state.xp} XP</div><p>${state.name}, has completado el reto final. Tu reflexión muestra que aprender los sacramentos también significa relacionarlos con la vida cotidiana.</p></div><button class="primary" style="width:100%" id="back">Volver al juego</button>`);$('back').onclick=()=>{dlg.close();game()}}}
function edit(){open(`<h2>Editar los 36 bloques</h2><p>Selecciona un bloque. Los cambios se guardarán en esta sesión del archivo.</p><div class="editor">${blocks.map(b=>`<button data-edit="${b.id}"><strong>${b.id+1}</strong><br>${b.title}</button>`).join('')}</div>`);document.querySelectorAll('[data-edit]').forEach(x=>x.onclick=()=>editOne(Number(x.dataset.edit)));}
function editOne(id){const b=blocks[id];open(`<h2>Editar bloque ${id+1}</h2><label>Título</label><input id="et" value="${b.title.replace(/"/g,'&quot;')}" style="width:100%"><label>Pregunta</label><textarea id="eq" style="width:100%;min-height:100px">${b.question}</textarea><label>Opción correcta</label><input id="eo" value="${b.options[b.correct].replace(/"/g,'&quot;')}" style="width:100%"><button class="primary" style="width:100%;margin-top:12px" id="saveEdit">Guardar</button>`);$('saveEdit').onclick=()=>{b.title=$('et').value.trim()||b.title;b.question=$('eq').value.trim()||b.question;b.options[b.correct]=$('eo').value.trim()||b.options[b.correct];save();edit();}}
function help(){open(`<h2>Cómo jugar</h2><ol><li>Abre este archivo en Google Chrome.</li><li>Pulsa <strong>Iniciar juego</strong>.</li><li>Elige un bloque de la torre y responde.</li><li>Las respuestas correctas suman XP y fortalecen la torre.</li><li>Al completar 24 bloques se habilita el reto final.</li></ol><p><strong>Importante:</strong> ya no necesitas <code>app.js</code>, <code>styles.css</code> ni la carpeta <code>data</code>. Todo está dentro de este archivo.</p>`)}
$('closeBtn').onclick=()=>dlg.close();$('homeBtn').onclick=home;$('helpBtn').onclick=help;$('editBtn').onclick=edit;$('resetBtn').onclick=()=>{if(confirm('¿Deseas reiniciar la partida?')){state={name:'',xp:0,stability:80,done:[]};save();home()}};home();
})();
</script>
</body></html>
